<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0a14" />
    <meta name="description" content="Coachella Weekend 1 stream planner — schedule, saves, and stage links." />
    <title>Coachella Stream Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Staatliches&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div id="app">
      <header class="top-bar">
        <div class="brand">
          <div>
            <p class="brand-tag">Weekend 1 · PDT</p>
            <h1>Stream <span>Planner</span></h1>
          </div>
        </div>
      </header>

      <div id="load-error" class="load-banner" hidden></div>

      <section id="view-now" class="view" hidden>
        <p class="section-label">Right now</p>
        <div id="now-live"></div>

        <div class="soon-control">
          <label for="soon-slider" class="mono" id="soon-value">20 min</label>
          <input type="range" id="soon-slider" min="5" max="45" step="5" value="20" aria-label="Starting soon window in minutes" />
        </div>

        <p class="section-label">Starting soon</p>
        <div id="now-soon"></div>

        <p class="section-label">Your next pick</p>
        <div id="now-next"></div>

        <p class="section-label">Stage streams</p>
        <div id="now-stages" class="stage-scroller"></div>

        <div class="shortcuts">
          <button type="button" class="btn btn-ghost" data-goto="my">My schedule</button>
          <button type="button" class="btn btn-ghost" data-goto="streams">All streams</button>
        </div>
      </section>

      <section id="view-schedule" class="view" hidden>
        <div class="toolbar">
          <div class="search-wrap">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input type="search" id="search-input" placeholder="Search artist or stage…" autocomplete="off" />
          </div>
          <div class="filters-grid">
            <select id="filter-day" aria-label="Filter by day"></select>
            <select id="filter-stage" aria-label="Filter by stage"></select>
          </div>
          <div class="filter-checks">
            <label><input type="checkbox" id="filter-saved" /> Saved only</label>
            <label><input type="checkbox" id="filter-live" /> Live now</label>
          </div>
        </div>
        <div id="schedule-list"></div>
      </section>

      <section id="view-my" class="view" hidden>
        <p class="section-label">Saved sets</p>
        <div id="my-list"></div>
      </section>

      <section id="view-streams" class="view" hidden>
        <p class="section-label">YouTube stages</p>
        <div id="streams-list"></div>
      </section>
    </div>

    <nav class="bottom-nav" aria-label="Main">
      <button type="button" class="nav-btn is-active" data-tab="now" aria-current="page">
        <span class="nav-icon" aria-hidden="true">◎</span>
        Now
      </button>
      <button type="button" class="nav-btn" data-tab="schedule">
        <span class="nav-icon" aria-hidden="true">☰</span>
        Schedule
      </button>
      <button type="button" class="nav-btn" data-tab="my">
        <span class="nav-icon" aria-hidden="true">★</span>
        My plan<span id="saved-badge" class="badge is-zero" aria-live="polite">0</span>
      </button>
      <button type="button" class="nav-btn" data-tab="streams">
        <span class="nav-icon" aria-hidden="true">▶</span>
        Streams
      </button>
    </nav>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
